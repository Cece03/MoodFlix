<!DOCTYPE html>
<html>
<head>
  <title>Ultimate Spin Wheel</title>

  <style>
    body {
  font-family: Arial;
  text-align: center;

  background: url("images/Wheel.png");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

.back-btn {
  position: absolute;
  top: 20px;
  left: 20px;

  padding: 8px 15px;
  background: rgba(0, 0, 0, 0.6);
  color: white;
  text-decoration: none;
  border-radius: 8px;

  backdrop-filter: blur(5px);

  font-size: 14px;
  transition: 0.3s;
}

    h1 {
  margin-top: 20px;
  color: white;
  text-shadow: 0 0 10px black;
}

    .container {
      position: relative;
      width: 700px;
      height: 700px;
      margin: auto;
      margin-top: 30px;
    }

    /* WHEEL */
    .wheel {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: conic-gradient(
        #ff7675, #74b9ff, #55efc4, #ffeaa7, #a29bfe, #fab1a0
      );
      position: absolute;
      top: 240px;
      left: 240px;
      transition: transform 2s ease-out;
    }

    /* ITEMS */
    .item {
      position: absolute;
      width: 180px;
      height: 120px;
      background: white;
      border-radius: 10px;
      padding: 5px;
      box-shadow: 0 0 5px rgba(0,0,0,0.2);
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border-radius: 10px;
    }

    /* POSITIONS */
    .top { top: 0; left: 260px; }
    .left { top: 260px; left: 0; }
    .right { top: 260px; right: 0; }
    .bottom-left { bottom: 0; left: 100px; }
    .bottom-right { bottom: 0; right: 100px; }

    /* MANGA */
    .manga img {
      width: 100%;
      height: 60px;
      object-fit: cover;
    }

    .manga h3 {
      font-size: 12px;
      margin: 2px;
    }

    .manga p {
      font-size: 10px;
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      cursor: pointer;
    }

  </style>
</head>

<body>

    <a href="UserDash.html" class="back-btn">⬅ Back</a>

<h1>Spin & Watch</h1>

<div class="container">

  <!-- ITEMS -->
  <div class="item top" id="kdrama"></div>
  <div class="item left" id="kpop"></div>
  <div class="item right" id="cdrama"></div>
  <div class="item bottom-left" id="anime"></div>
  <div class="item bottom-right manga" id="manga"></div>

  <!-- WHEEL -->
  <div class="wheel" id="wheel"></div>

</div>

<button onclick="spinWheel()">Spin</button>

<script>
let wheel = document.getElementById("wheel");

// YOUR DATA
let anime = [
"https://www.youtube.com/embed/LV-nazLVmgo",
"https://www.youtube.com/embed/x7uLutVRBfI",
"https://www.youtube.com/embed/MPfZhgLiK6w"
];

let kdrama = [
"https://www.youtube.com/embed/Y5Cp5V9_sKo",
"https://www.youtube.com/embed/8AcNEVUzV4o",
"https://www.youtube.com/embed/_J8tYxYB_YU"
];

let cdrama = [
"https://www.youtube.com/embed/tiwcMjH1dRw",
"https://www.youtube.com/embed/HrUeOw7zL40",
"https://www.youtube.com/embed/2ldvydu34Is"
];

let kpop = [
"https://www.youtube.com/embed/4TWR90KJl84",
"https://www.youtube.com/embed/Y8JFxS1HlDo",
"https://www.youtube.com/embed/I3dezFzsNss"
];

// MANGA DATA
let manga = [
{
  img: "https://cdn.myanimelist.net/images/manga/2/253146.jpg",
  title: "One Piece",
  desc: "Pirate adventure for ultimate treasure."
},
{
  img: "https://cdn.myanimelist.net/images/manga/3/117681.jpg",
  title: "Naruto",
  desc: "Ninja dreams of becoming Hokage."
},
{
  img: "https://cdn.myanimelist.net/images/manga/1/258245.jpg",
  title: "Death Note",
  desc: "Notebook that kills people."
}
];

function spinWheel() {

  let deg = Math.floor(2000 + Math.random() * 2000);
  wheel.style.transform = "rotate(" + deg + "deg)";

  // RANDOM PICKS
  document.getElementById("anime").innerHTML =
    `<iframe src="${anime[Math.floor(Math.random()*anime.length)]}" allowfullscreen></iframe>`;

  document.getElementById("kdrama").innerHTML =
    `<iframe src="${kdrama[Math.floor(Math.random()*kdrama.length)]}" allowfullscreen></iframe>`;

  document.getElementById("cdrama").innerHTML =
    `<iframe src="${cdrama[Math.floor(Math.random()*cdrama.length)]}" allowfullscreen></iframe>`;

  document.getElementById("kpop").innerHTML =
    `<iframe src="${kpop[Math.floor(Math.random()*kpop.length)]}" allowfullscreen></iframe>`;

  let m = manga[Math.floor(Math.random()*manga.length)];
  document.getElementById("manga").innerHTML =
    `<img src="${m.img}">
     <h3>${m.title}</h3>
     <p>${m.desc}</p>`;
}
</script>

</body>
</html>
